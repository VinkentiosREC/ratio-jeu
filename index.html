  <div><h3>La persuasion</h3><ul><li>Chaque bot a un <b>profil</b> visible sur ses posts : Rationnel, Sensible, Suiveur ou Cynique.</li><li><b>\xC9cris librement.</b> Le Tribunal lit ton post : intention (accuser, d\xE9fendre, te d\xE9fendre, juste parler\u2026), compte vis\xE9 (une @mention suffit) et ton. Tu peux corriger ces \xE9tiquettes d'un geste, ou piocher une <b>Id\xE9e</b> toute faite. \xC0 plusieurs sur un t\xE9l\xE9phone, vous pouvez aussi vous parler pour de vrai.</li><li>Chaque ton a son effet. Une <b>preuve</b> s'appuie sur les vrais faits de la partie (votes, d\xE9fenses, morts) et convainc les Rationnels. L'<b>\xE9motion</b> touche les Sensibles et agace les Cyniques. L'<b>effet de meute</b> entra\xEEne les Suiveurs, surtout contre un compte d\xE9j\xE0 vis\xE9. La <b>moquerie</b> pla\xEEt aux Cyniques et agace Sensibles et Rationnels.</li><li>La <b>fausse preuve</b> frappe fort, mais une note de la communaut\xE9 peut la d\xE9masquer : ta cr\xE9dibilit\xE9 s'effondre.</li><li>Ta <b>cr\xE9dibilit\xE9</b> multiplie l'effet de tes posts. Le <b>sondage</b> montre en direct qui risque d'\xEAtre cancel.</li><li>Sous chaque post, la liste des convaincus, sceptiques et agac\xE9s. La R\xE9acosph\xE8re ne change jamais d'avis : elle fait semblant. Les sceptiques inattendus sont des indices.</li><li><b>R\xE9pondre</b> dans le fil d'un post donne +15 % d'effet. <b>Approuver</b> un post le soutient un peu.</li></ul></div>

le ?",power:"Chaque nuit, elle v\xE9rifie un compte : elle apprend s'il ment sur le r\xF4le qu'il a d\xE9clar\xE9."},syndicaliste:{name:"La Syndicaliste",quote:"Les acquis sociaux ne s'obtiennent ni sans lutte, ni sans gr\xE8ve. ",power:"Une fois par partie, au d\xE9but de la nuit, elle d\xE9clenche une gr\xE8ve g\xE9n\xE9rale : aucun pouvoir de nuit ne fonctionne et personne n'est ratio."},hacktiviste:{name:"Le Hacktiviste",quote:"Donne-moi ton historique internet, je te dirai qui tu es.",power:"Une fois par partie, la nuit, il pirate un compte et d\xE9couvre son r\xF4le exact."},allie:{name:"L'Alli\xE9 performatif",quote:"Je laisse la parole aux personnes concern\xE9es, mais uniquement si j'ai assez de likes.",power:"S'il re\xE7oit 3 voix ou plus lors d'un vote sans \xEAtre cancel, il se vexe et rejoint la R\xE9acosph\xE8re la nuit suivante."},signataire:{name:"Le Buveur du Caf\xE9 de Flore",quote:"J'ai sign\xE9 une tribune contre la pr\xE9carit\xE9 depuis mon appartement de 180 m\xB2.",power:"Aucun pouvoir. Il vote, il d\xE9bat, il s'indigne."},centriste:{name:"Le Centriste",quote:"Ni d'un camp ni de l'autre, et des deux \xE0 la fois.",power:"\xC0 chaque vote, il vote pour deux joueurs diff\xE9rents, une voix chacun."},ministre:{name:"Le Ministre",quote:"Vous avez vot\xE9 contre ? C\u2019est dommage, le vote est d\xE9j\xE0 termin\xE9.",power:"Une fois par partie, avant le vote, il se r\xE9v\xE8le et d\xE9gaine le 49.3 : il d\xE9signe lui-m\xEAme le joueur cancel."},rallie:{name:"La Girouette",quote:"Ce n'est pas elle qui a chang\xE9, c'est son ancien parti qui est parti.",power:"Elle para\xEEt \xAB pas droitard \xBB au D\xE9colonial. C'est sa seule couverture, et elle vaut cher."},lobbyiste:{name:"La Lobbyiste",quote:"La p\xE9dagogie, c'est d'expliquer aux pauvres pourquoi les riches ont besoin de leur argent.",power:"Une fois par partie, au moment du vote, elle choisit une cible : deux comptes tir\xE9s au hasard votent pour elle, quoi qu'ils pensaient."},prefet:{name:"Le Pr\xE9fet",quote:"La manifestation n'est pas interdite, elle est juste r\xE9prim\xE9e avec force.",power:"Deux fois par partie, il \xAB d\xE9conseille \xBB un compte de poster ou de voter le lendemain. Le conseil est obligatoire."},sondeur:{name:"Le Sondeur",quote:"Marge d'erreur : 100 %.",power:"Une nuit sur deux, il sonde un compte : il apprend s'il est R\xE9acosph\xE8re, Ultragauche ou Centre mou."}},camps:{F:{name:"R\xE9acosph\xE8re",short:"Droitard",win:"Tu gagnes quand la R\xE9acosph\xE8re repr\xE9sente au moins la moiti\xE9 des comptes encore actifs."},G:{name:"Ultragauche",short:"Gauchiste",win:"Tu gagnes quand il ne reste plus aucun droitard ni aucun centriste."},C:{name:"Le Centre mou",short:"Centriste",win:"Tu gagnes avant tout par opportunisme ! \xC0 la fin d'une journ\xE9e, si le Centre mou compte au moins autant de comptes que chacun des deux autres camps, c'est gagn\xE9 ! Le Centre mou gagne aussi les \xE9galit\xE9s."}},events:{panne:{title:"Panne g\xE9ante du Tribunal",text:"Telle une primaire socialiste, les serveurs n'ont pas tenu ! Peu importe, pas de d\xE9bat aujourd'hui : on passe directement au vote."},badbuzz:{title:"Bad buzz",text:"Le post le plus approuv\xE9 du jour se retournera contre son auteur : +1 voix contre lui au vote."},shadowban:{title:"Shadowban",text:"@X a \xE9t\xE9 invisibilis\xE9 par l'algorithme : impossible de poster aujourd'hui."},greve:{title:"Gr\xE8ve des mod\xE9rateurs",text:"La nuit prochaine, la Militante Safe Space et la Mod\xE9ratrice ne pourront rien faire."},algo:{title:"Mise \xE0 jour de l'algorithme",text:"Aujourd'hui, toutes les voix comptent simple : le Pol\xE9miste et le Centriste perdent leur bonus."},fuite:{title:"Fuite de DM",text:"Des messages priv\xE9s ont fuit\xE9 : au moins un de ces deux comptes appartient \xE0 la R\xE9acosph\xE8re. @X ou @Y ?"},milliardaire:{title:"Rachat du r\xE9seau par un milliardaire",text:"Le nouveau patron a \xAB lib\xE9r\xE9 la parole \xBB. La nuit prochaine, la R\xE9acosph\xE8re fera deux victimes."},bienveillance:{title:"Journ\xE9e mondiale de la bienveillance",text:"Aujourd'hui, le joueur d\xE9sign\xE9 peut publier une story d'excuses, m\xEAme si elle a d\xE9j\xE0 servi."},vieuxpost:{title:"Un vieux post ressort",text:"Un post de 2014 sign\xE9 @X refait surface. Personne ne l'a lu en entier, tout le monde l'a partag\xE9 : +1 voix contre lui au vote."}},journal:{name:"La Source ",handle:"@LaSource \xB7 post \xE9pingl\xE9 du jour",foot:"\u{1F4AC} Le Tribunal commente en dessous. Accuse, d\xE9fends ou d\xE9clare-toi : ce soir, on vote pour cancel quelqu'un.",rubriqueDead:"Enqu\xEAte",rubriqueCalm:"Exclusif",readMore:"Lire l'article",paywall:"<b>La suite est r\xE9serv\xE9e \xE0 nos abonn\xE9s.</b> Abonnez-vous pour 1 \u20AC et culpabilisez pendant 3 mois.",calmH:["EXCLUSIF : il ne s'est rien pass\xE9 cette nuit","Une nuit sans victime : notre enqu\xEAte sur un silence assourdissant"],calmChapo:["Aucun compte supprim\xE9. Pour notre r\xE9daction, ce calme ne pr\xE9sage rien de bon."],calmBody:["Selon nos informations, recoup\xE9es aupr\xE8s d'une source anonyme et d'une capture d'\xE9cran floue, la R\xE9acosph\xE8re aurait \xE9t\xE9 mise en \xE9chec. Ou alors elle pr\xE9pare quelque chose. Nous n'excluons rien, surtout pas d'\xE9crire un deuxi\xE8me article sur le sujet."],strikeH:["GR\xC8VE G\xC9N\xC9RALE : la nuit n'a pas eu lieu"],strikeChapo:["Mod\xE9ration, enqu\xEAtes, ratio : tout s'est arr\xEAt\xE9 \xE0 minuit. Les syndicats revendiquent une \xAB nuit blanche historique \xBB."],strikeBody:["Selon nos informations, la R\xE9acosph\xE8re a tent\xE9 de se connecter \xE0 2 h 14. Le serveur affichait : \xAB Ferm\xE9 pour cause de lutte. \xBB La direction du r\xE9seau d\xE9nonce une prise d'otage, les gr\xE9vistes une prise de conscience."],strikeCaption:["Pour la premi\xE8re fois, la nuit avait \xE9t\xE9 calme pour de bonnes raisons."],raidH:["RAID : {VS} suppriment leur compte la m\xEAme nuit"],raidChapo:["Une op\xE9ration coordonn\xE9e a vis\xE9 {VSR}. R\xE9cit d'une nuit ordinaire au Tribunal."],harassH:["R\xC9V\xC9LATIONS : {V} a supprim\xE9 son compte apr\xE8s une nuit \xE0 se faire ratio","{V}, {r}, quitte le Tribunal apr\xE8s un raid nocturne"],harassChapo:["{V} ({R}) \xE9tait la cible d'un raid coordonn\xE9. Notre enqu\xEAte sur les coulisses d'une nuit au Tribunal."],harassBody:["Il \xE9tait 2 h 14 quand les premi\xE8res notifications sont arriv\xE9es. \xC0 2 h 31, {V} comptait 4 000 mentions. \xC0 2 h 32, son compte n'existait plus. \xAB {Il} ne lisait jamais les commentaires \xBB, confie un proche, qui ne lit pas non plus nos articles."],banH:["BANNI : {V} victime d'une mod\xE9ration \xAB exemplaire \xBB"],banChapo:["Le compte de {V} ({R}) a \xE9t\xE9 suspendu cette nuit, sans pr\xE9avis ni explication."],banBody:["La d\xE9cision viendrait d'une mod\xE9ratrice qui, selon nos sources, n'avait plus acc\xE8s \xE0 rien depuis 2022. Le r\xE9seau n'a pas souhait\xE9 r\xE9pondre \xE0 nos questions, ni \xE0 celles de personne."],alsoBanned:["Dans la m\xEAme nuit, {VS} a \xE9t\xE9 banni par la mod\xE9ration."],chain:["<b>Derni\xE8re minute.</b> {Z}, le Zadiste, s'est encha\xEEn\xE9 \xE0 {V} ({R}) avant de partir. Les deux comptes ont disparu."]},story:{intro:"Pour donner son opinion, tout se passe sur <b>Le Tribunal</b>, le r\xE9seau social o\xF9 tout le monde juge tout le monde.",nightT:"La nuit",night:"La R\xE9acosph\xE8re se retrouve en DM et s'acharne sur un compte jusqu'\xE0 le faire supprimer. Certains r\xF4les agissent en secret.",morningT:"Le matin",morning:"<i>La Source</i>, le journal du r\xE9seau, publie son enqu\xEAte en post \xE9pingl\xE9 : qui a disparu, et quel \xE9tait son r\xF4le.",dayT:"La journ\xE9e",day:"Tous les membres du Tribunal commentent sous l'article : on accuse, on d\xE9fend, on se d\xE9clare. Les bots se laissent convaincre\u2026 ou pas.",eveningT:"Le soir",evening:"Vote de cancel. Le compte le plus vis\xE9 est supprim\xE9 et son r\xF4le r\xE9v\xE9l\xE9.",campF:"Se cache dans le Tribunal. Gagne quand elle repr\xE9sente la moiti\xE9 des comptes encore actifs.",campG:"La majorit\xE9. Gagne quand il ne reste ni droitard ni centriste.",campC:"Compte les points. Gagne si, un soir, il a au moins autant de comptes que chacun des deux autres camps.",btnSolo:"D\xE9couvrir mon r\xF4le",btnMulti:"Distribuer les r\xF4les",tuto1T:"Un r\xF4le secret, un camp",tuto1:"Chaque compte re\xE7oit un r\xF4le secret et appartient \xE0 un camp. Tu gagnes avec ton camp. Les bots jouent aussi, et certains mentent. Ton r\xF4le reste toujours dans <b>Mon carnet</b>, en haut.",tuto2T:"La nuit, on agit en secret",tuto2:"Certains r\xF4les ont un pouvoir : choisis une cible quand l'\xE9cran te le demande. \xC0 plusieurs, le t\xE9l\xE9phone passe de main en main et chacun attend le m\xEAme temps, pour que rien ne se devine.",tuto3T:"Le matin, le journal",tuto3:"Le journal du r\xE9seau publie en post \xE9pingl\xE9 qui a disparu et quel \xE9tait son r\xF4le. Lis-le : c'est ton premier indice, et tout le Tribunal commente en dessous.",tuto4T:"La journ\xE9e, on poste",tuto4:"Tu as 4 posts par jour : accuser, d\xE9fendre, te d\xE9clarer, ou \xE9crire librement. Tu peux mentir sur ton r\xF4le. Chaque bot a un profil (Rationnel, Sensible, Suiveur, Cynique) et r\xE9agit selon ton ton.",tuto5T:"Le soir, le cancel",tuto5:"Tout le monde vote. Le compte le plus vis\xE9 est cancel et son r\xF4le est r\xE9v\xE9l\xE9. En cas d'\xE9galit\xE9, personne n'est cancel.",tuto6T:"Tes outils",tuto6:"Touche un avatar en haut pour voir un profil. <b>Mon carnet</b> garde tout ce que tu sais. Les r\xE8gles compl\xE8tes et les r\xE9glages sont dans le menu."},lists:{"T.accuse":["Je dis \xE7a, je dis rien, mais @T a lik\xE9 un post tr\xE8s bizarre \xE0 3 h du matin.","@T est beaucoup trop calme pour quelqu'un d'innocent.","Thread (1/14) : pourquoi @T me met mal \xE0 l'aise. Je commence par sa photo de profil.","Personne ne trouve louche que @T n'ait rien post\xE9 sur la nuit derni\xE8re ?","J'ai des captures d'\xE9cran de @T. Je ne les montrerai pas, mais je les ai.","Quand @T dit \xAB je me pose des questions \xBB, moi je m'en pose sur @T.","@T, ton silence est un aveu. Ton dernier post aussi, d'ailleurs.","\xC7a fait deux jours que @T r\xE9pond \xE0 c\xF4t\xE9. On appelle \xE7a un indice.","Moi je vote @T. Je n'ai pas d'argument, j'ai une intuition.","@T a chang\xE9 sa photo de profil cette nuit. Comme par hasard.","Je ne veux pas faire de proc\xE8s d'intention, mais @T est coupable.","Vous avez remarqu\xE9 le ton de @T ? Il y a un ton.","Signal\xE9 @T. Motif : vibes.","@T d\xE9fend tout le monde sauf les victimes. Int\xE9ressant.","Un vieux post de @T commence par \xAB sans vouloir \xEAtre m\xE9chant \xBB. Je vous laisse conclure.","Je me m\xE9fie des gens qui \xE9crivent \xAB bonne journ\xE9e \xBB avec un point final. Je parle de toi, @T.","@T parle beaucoup de libert\xE9 d'expression pour quelqu'un qui ne dit rien.","Mon petit doigt me dit que c'est @T. Mon petit doigt a un excellent bilan.","@T suit 4 000 comptes et n'en lit aucun. Exactement le profil.","J'ai demand\xE9 \xE0 @T ce qu'{il|elle} pensait de la nuit derni\xE8re. {Il|Elle} a r\xE9pondu \xAB bof \xBB. BOF.","@T a vot\xE9 n'importe comment hier. Ou alors pas n'importe comment, justement."],"T.accuseVote":["@T a vot\xE9 contre un innocent hier. Je ne l'oublie pas.","Rappel : @T a vot\xE9 pour cancel quelqu'un de clean. \xC7a ne vous d\xE9range pas ?","Le vote de @T hier, c'\xE9tait soit de la b\xEAtise, soit du calcul. Je penche pour le calcul."],"T.defend":["@T a sign\xE9 ma tribune sur les Tasty Crousty. {Il|Elle} est clean.","Accuser @T, c'est exactement ce que voudrait la R\xE9acosph\xE8re.","@T est innocent{|e}. Je n'ai aucune preuve, mais je le sens.","Je mets ma main au feu pour @T. Enfin, une main. La gauche.","Arr\xEAtez l'acharnement contre @T. Ou alors \xE0 visage d\xE9couvert.","@T a partag\xE9 une cagnotte pour des chatons. \xC7a compte, non ?","On va vite en bes
